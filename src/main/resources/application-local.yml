server:
  port: 9192

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      # F-09 V1 배치(InvestmentAnalysisBatchService)가 스레드풀(24)로 동시 조회하므로 기본값(10)보다
      # 넉넉히 잡는다 — Postgres max_connections(100) 대비 여유 있음.
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

logging:
  level:
#    com.zaxxer.hikari: DEBUG
    com.mteam.sleerenthome.utils.HeaderSizeFilter: DEBUG

security:
  jwt:
    expirationTime: 86400  # 토큰의 유효 기간 (단위: 초)
    secret: ${JWT_SECRET}    # JWT 서명을 위한 비밀 키

cors:
  allowed-origin: ${ALLOWED_ORIGIN}

external:
  seoul-openapi:
    service-key: ${SEOUL_OPENAPI_KEY}

# 원본 데이터 파일(zip/CSV) 기본 폴더 — 비밀값 아니라 .env 대신 여기 직접 둔다.
# 로컬(IntelliJ 직접 실행)은 Windows 호스트 경로를 그대로 쓰지만, 서버(Docker)는 컨테이너에 볼륨 마운트가
# 별도로 필요하다(FEATURE_12_DATA_BATCH.md 참고, 아직 미설정).
data-migration:
  data-dir: C:/rebuild-project/rebuild-infra/postgres/data
