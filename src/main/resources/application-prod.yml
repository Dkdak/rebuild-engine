server:
  port: 9192
  address: 0.0.0.0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

logging:
  level:
    #    com.zaxxer.hikari: DEBUG
    com.mteam.sleerenthome.utils.HeaderSizeFilter: DEBUG

security:
  jwt:
    expirationTime: 86400  # 토큰의 유효 기간 (단위: 초)
    secret: ${JWT_SECRET}    # JWT 서명을 위한 비밀 키

cors:
  allowed-origin: ${ALLOWED_ORIGIN}

external:
  seoul-openapi:
    service-key: ${SEOUL_OPENAPI_KEY}

# 서버(Docker) 컨테이너 내부 경로 — 아직 postgres/data를 backend 컨테이너에 볼륨 마운트하지 않아서
# 지금은 서버에서 이 관리자용 API를 실제로 쓸 수 없다(FEATURE_12_DATA_BATCH.md 참고, 후속 작업 필요).
data-migration:
  data-dir: /app/postgres-data
